name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native libraries and audit tooling
        run: pacman -Syu --noconfirm --needed git gtk4 gtk4-layer-shell rustup cargo-audit pkgconf

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Run repository gates
        run: bash .github/scripts/check.sh --tree
