# Synthetic public-safe example. Unknown keys are rejected.
schema_version = 1

# Omit this setting to follow GTK's animation preference.
reduced_motion = false

# The default trigger is a small island placed inside the widest top-edge
# segment that is not covered by an output above it. All dimensions are GDK
# logical pixels, so fractional-scale outputs keep the same physical intent.
[activation]
mode = "exposed-edge"
width = 96
height = 8
margin = 12
anchor = "end"

[ribbon]
show_workspace = true
show_context = true
show_clock = true

# Colors accept only #RRGGBB or #RRGGBBAA. The font family is restricted to
# letters, numbers, spaces, and hyphens before it enters generated GTK CSS.
[theme]
background = "#111012F2"
surface = "#191719FA"
text = "#DDD6D0"
muted = "#928985"
accent = "#E06B5F"
border = "#443735"
warning = "#D6A34A"
critical = "#EF5F5A"
font_family = "monospace"
font_size = 10
radius = 7
