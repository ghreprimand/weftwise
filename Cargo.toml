[package]
name = "weftwise"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
description = "A minimal top-edge desktop interface for OdysseyOS and Hyprland"
license = "GPL-3.0-only"
repository = "https://github.com/ghreprimand/weftwise"
publish = false

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["async-await"] }
gtk4-layer-shell = "0.8.1"
pipewire = { version = "0.10.1", optional = true }
relm4 = { version = "0.11.0", default-features = false, features = ["gnome_42", "macros"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.53.0", default-features = false, features = ["io-util", "macros", "net", "process", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[features]
default = ["audio-transport"]
# Enables the direct PipeWire audio transport adapter and its optional
# `pipewire` dependency. The pure audio domain and typed contracts build
# without this feature; only the loop-thread transport requires it.
audio-transport = ["dep:pipewire"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
